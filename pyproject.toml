[project]
name = "jjdiff"
version = "0.6.2"
description = "A TUI that can be used as a diff editor in the jujutsu vcs."
readme = "README.md"
authors = [
    { name = "Daan van der Kallen", email = "mail@daanvdk.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grapheme>=0.6.0",
    "pydantic>=2.11.7",
    "wcwidth>=0.2.0",
]

[project.scripts]
jjdiff = "jjdiff:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "pytest-cov>=6.0",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.5",
]

[tool.pytest.ini_options]
addopts = "--cov=jjdiff --cov-report=term-missing"

[tool.coverage.run]
source = ["src/jjdiff"]
omit = ["src/jjdiff/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
reportUnusedCallResult = false

[tool.poe.tasks]
lint = "ruff check"
lint-check = "ruff check --no-fix"
format = "ruff format"
format-check = "ruff format --check"
typecheck = "pyright"
test = "pytest"
check = ["lint", "format", "typecheck", "test"]
